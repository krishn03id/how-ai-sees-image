name: Render Manim video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb \
            libglfw3 libgl1-mesa-glx libgl1-mesa-dri libegl1-mesa mesa-utils \
            pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu
          sudo apt-get install -y libraqm0 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render video (headless, software OpenGL via xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            manimgl scene.py HowAISees -w -m
          echo "--- produced mp4 files ---"
          find media -name '*.mp4' -print
          find media -name '*.mp4' -print -quit | xargs -I{} cp {} out/how_ai_sees.mp4
          ls -la out

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: how-ai-sees-video
          path: out/how_ai_sees.mp4
          if-no-files-found: error

      - name: Attach video to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest out/how_ai_sees.mp4 \
            --title "How an AI sees an image" \
            --notes "Rendered ManimGL video (auto-built from latest main)." \
            --target main || \
          gh release upload latest out/how_ai_sees.mp4 --clobber
